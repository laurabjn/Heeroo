<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heeroo — Paiement non abouti</title>
<!--
  Page de retour d'un paiement de course qui n'a pas abouti, pour le passager.
  Voir course-ok.html pour la raison d'être de ces deux pages distinctes de
  celles de la recharge chauffeur, et pour l'absence de bouton de retour.
-->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #181717; color: #ECECEA; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  .mark { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px; }
  .mark span { color: #2EBD6B; }
  .badge { width: 64px; height: 64px; border-radius: 50%; background: #B42318; margin: 0 auto 20px; display: grid; place-items: center; font-size: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; font-weight: 600; }
  p { margin: 0 0 12px; line-height: 1.55; color: #B9B9B5; }
</style>
</head>
<body>
<main>
  <div class="mark">heer<span>o</span>o</div>
  <div class="badge">✕</div>
  <h1>Paiement non abouti</h1>
  <p>Le paiement n'a pas été effectué, et aucun montant n'a été débité. La course reste à régler.</p>
  <p>Revenez dans l'application Heeroo pour réessayer ou choisir un autre moyen de paiement.</p>
</main>
</body>
</html>
