<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heeroo — Course payée</title>
<!--
  Page de retour d'un paiement de course, pour le passager.

  Distincte de /wave/succes.html, qui est la page de retour d'une recharge de
  crédit chauffeur : celle-ci parle de crédit et renvoie vers Heeroo Driver par
  lien profond. Le paiement de course y atterrissait aussi, et annonçait donc au
  passager la mise à jour d'un crédit qu'il n'a pas.

  Pas de bouton de retour ici : l'application passager n'a pas de schéma de lien
  profond déclaré (app.json). En ajouter un demanderait un nouveau binaire ;
  d'ici là, le passager revient à son application lui-même.
-->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #181717; color: #ECECEA; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  .mark { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px; }
  .mark span { color: #2EBD6B; }
  .badge { width: 64px; height: 64px; border-radius: 50%; background: #1B7F4A; margin: 0 auto 20px; display: grid; place-items: center; font-size: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; font-weight: 600; }
  p { margin: 0 0 12px; line-height: 1.55; color: #B9B9B5; }
</style>
</head>
<body>
<main>
  <div class="mark">heer<span>o</span>o</div>
  <div class="badge">✓</div>
  <h1>Course payée</h1>
  <p>Merci, votre paiement est enregistré. Vous pouvez revenir dans l'application Heeroo.</p>
  <p>Le reçu de la course s'y affichera dans quelques instants.</p>
</main>
</body>
</html>
