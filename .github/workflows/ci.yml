# Intégration continue Heeroo : vérifications à chaque push et pull request.
# Bloquant : apps mobiles (analyse statique, compilation, dépendances, config),
# fonctions serveur (tests), règles Firebase (JSON valide).
# Back-office admin : installation et build (Create React App 3, Node 16).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Declencheur manuel, pour rattraper un evenement perdu.
  #
  # Arrive le 4 nov. 2026 : un « git push » refuse par une erreur interne de
  # GitHub, puis reussi au second essai — la reference a bien ete mise a jour,
  # mais aucune execution n'a ete creee (zero run, zero check-run sur le
  # commit dd50931). Sans ce declencheur, le seul rattrapage etait un commit
  # vide, c'est-a-dire salir l'historique pour reparer une panne de GitHub.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: App ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [heeroo-rider, heeroo-driver]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (identifiants, styles, textes, navigation, assets)
        working-directory: .
        run: node tools/check-sources.js ${{ matrix.app }}

      - name: Compilation Babel de tous les fichiers
        working-directory: .
        run: node tools/compile-sources.js ${{ matrix.app }}

      # Le script compare les deux applications d'un coup : la matrice le
      # lance donc deux fois, pour quatre fichiers lus. On garde la
      # simplicite plutot qu'un job separe.
      - name: Concordance des dictionnaires français et anglais
        working-directory: .
        run: node tools/verifie-dictionnaires.js

      # Trois parties : les fonctions pures, le dialogue reellement construit
      # avec react-native et firebase doubles, et des controles de source qui
      # verifient que le bouton est sur l'ecran ou le chauffeur attend. Cette
      # derniere partie existe parce que le 10 nov. 2026 tous les essais
      # unitaires passaient pendant que le bouton etait sur le mauvais ecran.
      - name: Bouton SOS du chauffeur
        working-directory: .
        run: node tools/verifie-sos.js

      # La regle du mot de passe a l inscription. Elle plafonnait a quinze
      # caracteres et interdisait les tirets, donc elle refusait les mots de
      # passe que le gestionnaire de Google propose sur Android : le client a
      # signale le 10 nov. 2026 que sur certains telephones l application
      # demandait un mot de passe long et complique. L essai le plus important
      # du lot est le dernier : la CONNEXION ne doit jamais valider le mot de
      # passe, sinon les comptes deja crees se retrouvent dehors.
      - name: Règle du mot de passe à l'inscription
        working-directory: .
        run: node tools/verifie-mot-de-passe.js

      # Les messages d erreur a la creation d un compte. Le bloc catch
      # annoncait une adresse deja utilisee quelle que soit la raison du
      # refus, coupure reseau comprise. La partie qui compte est la deuxieme :
      # la table cite des cles de dictionnaire par leur nom, et une cle absente
      # afficherait « undefined » dans l alerte.
      - name: Messages d'erreur à l'inscription
        working-directory: .
        run: node tools/verifie-inscription.js

      # Le contrôle complet est conservé, mais une dérive de versions purement
      # correctives devient un avertissement : Expo en publie plusieurs par
      # semaine, et la CI tombait sur des commits n'ayant touché aucune
      # dépendance. Tout autre décalage bloque comme avant.
      - name: Cohérence des dépendances avec le SDK Expo
        working-directory: .
        run: node tools/expo-doctor-ci.js ${{ matrix.app }}
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Configuration Expo — développement
        run: npx expo config --type public --json > /dev/null
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Configuration Expo — production
        run: npx expo config --type public --json > /dev/null
        env:
          APP_ENV: production
          EXPO_NO_TELEMETRY: '1'

  functions:
    name: Fonctions serveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Chargement du module (toutes les fonctions s'exportent)
        run: node -e "const m = require('./index.js'); const n = Object.keys(m).length; console.log(n, 'fonctions'); if (n < 15) process.exit(1)"
        env:
          GCLOUD_PROJECT: heeroo-dev-49beb
          FIREBASE_CONFIG: '{"projectId":"heeroo-dev-49beb","databaseURL":"https://heeroo-dev-49beb-default-rtdb.europe-west1.firebasedatabase.app"}'

  rules:
    name: Règles et configuration Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JSON valides (firebase.json, database.rules.json, .firebaserc)
        run: |
          for f in firebase.json database.rules.json .firebaserc; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8')); console.log('$f : ok')"
          done

      - name: Fichiers de règles déclarés dans firebase.json présents
        run: |
          node -e "
            const c = require('./firebase.json');
            const fs = require('fs');
            for (const f of [c.database && c.database.rules, c.storage && c.storage.rules]) {
              if (f && !fs.existsSync(f)) { console.error('fichier de règles manquant :', f); process.exit(1); }
              if (f) console.log(f, ': présent');
            }"

  admin:
    name: Back-office admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heeroo-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: heeroo-admin/package-lock.json
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Build (configuration de production)
        run: npm run build
        env:
          CI: 'false'
          REACT_APP_ENV: production
