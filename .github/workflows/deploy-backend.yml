# Déploiement du backend Firebase (fonctions serveur + règles base et stockage).
#
#  - Automatique vers l'environnement « dev » à chaque push sur main qui touche
#    le backend (après réussite de la CI).
#  - Manuel (onglet Actions → « Run workflow ») vers « dev » ou « prod ».
#    L'environnement GitHub « prod » peut exiger une validation humaine
#    (Settings → Environments → prod → Required reviewers).
#
# Secret attendu dans chaque environnement GitHub (dev, prod) :
#   FIREBASE_SERVICE_ACCOUNT — clé JSON d'un compte de service du projet Firebase
#   correspondant.
#
# Ce compte a besoin de SEPT rôles, découverts un par un le 3 nov. 2026, chaque
# manque n'apparaissant qu'une fois le précédent réparé :
#
#   roles/editor                        les fonctions, le build, Artifact Registry, Cloud Run
#   roles/firebase.admin                la lecture du projet et des règles
#   roles/iam.serviceAccountUser        « ActAs » sur le compte sous lequel tournent les fonctions
#   roles/serviceusage.serviceUsageAdmin  vérifier qu'une API est activée
#   roles/firebasestorage.admin         firebasestorage.defaultBucket.get — absent de firebase.admin
#   roles/secretmanager.admin           les secrets portés par les fonctions
#   roles/cloudfunctions.admin          cloudfunctions.functions.setIamPolicy, pour ouvrir
#                                       une fonction HTTPS *neuve* au public
#
# Le septième ne s'est montré que le 3 nov. 2026, en fin de journée, à
# l'ajout des cinq points d'entrée d'Orange Money : les six premiers
# suffisent à mettre à jour des fonctions existantes, mais pas à en publier
# une nouvelle. Une fonction HTTPS doit être rendue appelable par tous, et
# poser cette règle d'accès est un droit que roles/editor ne porte pas. Un
# déploiement qui ne touche aucune fonction neuve passera donc sans lui, et
# le prochain ajout échouera — d'où cette note plutôt qu'un rôle oublié.
#
# Toutes les erreurs de droits échouent en 19 à 23 secondes : la durée ne dit
# donc pas si on a avancé. Seul le journal le dit, et « gh run view <id>
# --attempt <n> --log-failed » le donne en une commande.

name: Déploiement backend

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      only:
        description: Cibles Firebase à déployer
        type: choice
        required: true
        default: functions,database,storage
        options:
          - functions,database,storage
          - functions
          - database,storage

concurrency:
  group: deploy-backend-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests des fonctions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Déployer vers ${{ inputs.environment || 'dev' }}
    needs: tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci

      - name: Identifiants Firebase (compte de service de l'environnement)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT absent de l'environnement « ${{ inputs.environment || 'dev' }} »."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      # Version figée : « @latest » faisait dépendre chaque déploiement de ce que
      # npm avait publié le matin même. 15.34.2 est celle du premier déploiement
      # réussi, le 3 nov. 2026. À relever volontairement, jamais par surprise.
      - name: Déployer
        # ORANGE_ENABLED commande la déclaration des secrets d'Orange Money
        # (voir functions/index.js). Absente, elle vaut « non » : les points
        # d'entrée Orange sont déployés mais inertes, et tout le reste se
        # déploie normalement. Firebase refuse en effet de déployer une
        # fonction qui déclare un secret absent de Secret Manager, et il
        # refuse le déploiement entier : sans ce garde-fou, une
        # fonctionnalité pas encore commandée emporte les autres.
        # À poser à « true » dans l'environnement GitHub (Settings →
        # Environments) le jour où les deux secrets existent.
        env:
          ORANGE_ENABLED: ${{ vars.ORANGE_ENABLED }}
        run: |
          npx --yes firebase-tools@15.34.2 deploy \
            --only "${{ inputs.only || 'functions,database,storage' }}" \
            --project "${{ inputs.environment || 'dev' }}" \
            --non-interactive --force

      - name: Nettoyage des identifiants
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
